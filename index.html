<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f8f3"><title>Git 练习场 · Branch Lab</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><header><div class="bar"><div class="brand"><span class="brandmark" data-icon="branch"></span>Branch Lab</div><nav aria-label="视图"><button id="labTab" aria-current="page">练习台</button><button id="cardsTab">指令卡片</button></nav><span class="local"><i></i> 本地模拟</span></div></header>
<main><div class="intro"><div><h1>Git <span>&amp;</span> GitHub 练习场<b>.</b></h1><p>和同伴一起改一份旅行清单，练会版本管理。</p></div><div class="meter"><div><span>练习进度</span><strong id="count"></strong></div><div id="segments"></div></div></div>
<div id="workspace" class="layout"><section class="lab" aria-label="当前练习"><div class="cardhead"><span class="tag" id="step"></span><span class="topic" id="topic"></span></div><div class="question"><h2 id="title" tabindex="-1"></h2><p id="prompt"></p></div><div class="scene"><div class="scenehead"><span><i></i> 状态演示</span><span id="sceneMode">操作前</span></div><div id="drawing"></div></div><div class="operation"><div class="ophead"><h3>选择你的操作</h3><button class="hint" id="hintBtn" aria-expanded="false"><span data-icon="bulb"></span>看提示</button></div><div id="hint" hidden></div><div id="choices"></div><div id="feedback" role="status"></div><button id="next" hidden></button></div></section>
<aside><h2>练习路线 <span>6 站</span></h2><ol id="route"></ol><div class="project"><span data-icon="folder"></span><div><small>模拟项目</small><strong>旅行清单</strong></div><code>trip-notes</code></div></aside></div>
<section id="cards" hidden><h2 tabindex="-1">指令卡片</h2><p>点开一张卡，回想它会改变哪里。</p><div id="deck"></div><button class="primary" id="return">回到练习</button></section>
<section id="finish" hidden><div class="award" data-icon="flag"></div><h2 tabindex="-1">六站完成！</h2><p>你已经把旅行清单从本地修改带到了团队协作。</p><div id="summary"></div><button class="primary" id="again">从头再练</button><button class="secondary" id="review">翻看指令卡</button></section>
</main><footer><span data-icon="branch"></span> Branch Lab <span class="sep">/</span> Git 入门练习</footer></body></html>
